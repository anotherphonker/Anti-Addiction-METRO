<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Metro UI Anti-Bağımlılık Yazılımı</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
input,textarea{user-select:text}
body{background:#000;min-height:100vh;min-height:100dvh;overflow-x:hidden;color:#fff}

/* ===== BOOT SCREEN ===== */
.boot-screen{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999;transition:opacity .6s cubic-bezier(.4,0,.2,1),visibility .6s;padding:20px;text-align:center}
.boot-screen.fade-out{opacity:0;visibility:hidden}
.boot-custom-emblem{width:130px;height:130px;margin-bottom:65px;transform:perspective(450px) rotateY(18deg);filter:drop-shadow(0 0 25px rgba(0,173,239,.45));animation:pulseLogo 3s infinite alternate ease-in-out}
@keyframes pulseLogo{0%{filter:drop-shadow(0 0 15px rgba(0,173,239,.3));transform:perspective(450px) rotateY(18deg) scale(1)}100%{filter:drop-shadow(0 0 30px rgba(0,173,239,.7));transform:perspective(450px) rotateY(18deg) scale(1.04)}}
.win8-spinner{position:relative;width:48px;height:48px}
.win8-ring{position:absolute;inset:0;opacity:0;animation:win8Orbit 4s infinite cubic-bezier(.2,.6,.8,.4)}
.win8-ring::after{content:'';position:absolute;left:21px;top:0;width:6px;height:6px;border-radius:50%;background:#fff}
.win8-ring:nth-child(1){animation-delay:0s}.win8-ring:nth-child(2){animation-delay:.16s}.win8-ring:nth-child(3){animation-delay:.32s}.win8-ring:nth-child(4){animation-delay:.48s}.win8-ring:nth-child(5){animation-delay:.64s}
@keyframes win8Orbit{0%{transform:rotate(0);opacity:0}15%{opacity:1}35%{transform:rotate(280deg);opacity:1}50%{transform:rotate(360deg);opacity:1}65%{transform:rotate(640deg);opacity:1}75%{opacity:0}100%{transform:rotate(720deg);opacity:0}}
.boot-main-title{margin-top:45px;font-size:16px;font-weight:300;letter-spacing:4px;color:#fff;text-transform:uppercase}
.boot-disclaimer{position:absolute;bottom:25px;font-size:11px;font-weight:300;color:#666;max-width:600px;line-height:1.4;padding:0 15px}

/* ===== GLOBAL LANGUAGE TOGGLE (TOP-RIGHT) ===== */
.lang-toggle{position:fixed;top:16px;right:16px;z-index:900;display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(6px);padding:8px 14px;cursor:pointer;transition:all .18s;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.lang-toggle:hover{background:rgba(0,120,215,.75);border-color:#fff;transform:scale(1.04)}
.lang-toggle:active{transform:scale(.95)}
.lang-toggle .flag{font-size:20px;line-height:1}
.lang-toggle .code{font-size:12px;font-weight:700;letter-spacing:1.5px;color:#fff}
@media(max-width:767px){.lang-toggle{top:10px;right:10px;padding:6px 10px}.lang-toggle .code{display:none}}

/* ===== OOBE ===== */
.oobe-screen{background:#121212;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:30px;animation:fadeIn .6s ease-out}
@keyframes fadeIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
.oobe-box{max-width:680px;width:100%;margin:auto 0}
.oobe-title{font-size:38px;font-weight:200;margin-bottom:6px;letter-spacing:-.5px}
.oobe-desc{font-size:15px;font-weight:300;color:#aaa;margin-bottom:28px}
.form-group{margin-bottom:20px}
.oobe-label{display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:#00ADEF;margin-bottom:8px}
.oobe-input{width:100%;padding:13px 16px;font-size:17px;font-weight:300;background:#202020;border:2px solid #3d3d3d;color:#fff;outline:none;transition:all .2s}
.oobe-input:focus{border-color:#00ADEF;background:#282828}
.oobe-input.error{border-color:#e81123;background:rgba(232,17,35,.15)}
.error-text{color:#ff4754;font-size:13px;margin-top:6px;display:none;font-weight:400;line-height:1.4}
.addiction-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:8px;margin-bottom:12px}
.addict-card{background:#252525;border:2px solid #383838;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;transition:all .15s;min-height:85px}
.addict-card:hover{background:#2e2e2e;border-color:#555}
.addict-card.selected{background:#0078D7;border-color:#fff;box-shadow:0 4px 15px rgba(0,120,215,.4);transform:scale(1.02)}
.addict-ic{font-size:26px;margin-bottom:6px}
.addict-name{font-size:13px;font-weight:600;line-height:1.2}
.oobe-btn{background:#00ADEF;color:#fff;border:none;padding:15px 45px;font-size:16px;font-weight:600;cursor:pointer;transition:all .15s;text-transform:uppercase;letter-spacing:1.5px;margin-top:5px;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.oobe-btn:hover{background:#26bfff}.oobe-btn:active{transform:scale(.97);background:#008cc2}
.setup-legal-notice{font-size:11px;color:#666;text-align:center;max-width:580px;margin-top:25px;line-height:1.5;padding-bottom:10px}
.support-notice{background:rgba(255,140,0,.12);border-left:4px solid #FF8C00;padding:12px 14px;margin-top:10px;font-size:12.5px;color:#ffcf9e;line-height:1.55;overflow-wrap:break-word}

/* ===== START SCREEN (CROSS-PLATFORM RESILIENT GRID) ===== */
.start-screen{background:linear-gradient(135deg,#0b1d30 0%,#173b5e 50%,#0c4a75 100%);min-height:100vh;min-height:100dvh;padding:25px 40px;position:relative;overflow-y:auto;overflow-x:hidden;width:100%}
.start-screen.animate-in .tile{opacity:0;animation:metroTileSlideIn .45s cubic-bezier(.1,.9,.2,1) forwards}
@keyframes metroTileSlideIn{0%{opacity:0;transform:perspective(500px) rotateY(-20deg) translateZ(-50px) translateX(60px)}100%{opacity:1;transform:perspective(500px) rotateY(0) translateZ(0) translateX(0)}}
.start-screen.animate-in .tile:nth-child(1){animation-delay:.05s}.start-screen.animate-in .tile:nth-child(2){animation-delay:.1s}.start-screen.animate-in .tile:nth-child(3){animation-delay:.14s}.start-screen.animate-in .tile:nth-child(4){animation-delay:.18s}.start-screen.animate-in .tile:nth-child(5){animation-delay:.22s}.start-screen.animate-in .tile:nth-child(6){animation-delay:.26s}.start-screen.animate-in .tile:nth-child(7){animation-delay:.3s}.start-screen.animate-in .tile:nth-child(8){animation-delay:.34s}.start-screen.animate-in .tile:nth-child(9){animation-delay:.38s}.start-screen.animate-in .tile:nth-child(10){animation-delay:.42s}.start-screen.animate-in .tile:nth-child(11){animation-delay:.46s}
.win-header{display:flex;justify-content:space-between;align-items:center;max-width:1320px;margin:0 auto 25px;padding-bottom:10px;padding-right:80px;width:100%;gap:16px}
.win-user-area{display:flex;align-items:center;gap:16px;cursor:pointer;padding:6px 12px;transition:background .2s;min-width:0}
.win-user-area:hover{background:rgba(255,255,255,.1)}
.user-avatar{width:52px;height:52px;background:#00ADEF;border:2px solid rgba(255,255,255,.8);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:25px;box-shadow:0 4px 12px rgba(0,0,0,.35);flex-shrink:0}
.user-name-title{font-size:24px;font-weight:200;display:flex;align-items:center;gap:10px;flex-wrap:wrap;word-break:break-word}
.habit-badge-header{font-size:12px;font-weight:600;background:rgba(255,255,255,.15);padding:4px 10px;letter-spacing:.5px;text-transform:uppercase;border-radius:4px}
.user-status-sub{font-size:13px;color:#a0d8ff;margin-top:2px}
.header-clock{text-align:right;flex-shrink:0}
.clock-time{font-size:36px;font-weight:200;line-height:1}
.clock-date{font-size:13px;color:rgba(255,255,255,.8);margin-top:4px}
.metro-container{max-width:1320px;margin:0 auto;width:100%}
.groups-wrapper{display:flex;flex-wrap:wrap;gap:26px;width:100%}
.tile-group{flex:1 1 310px;min-width:0;max-width:100%;width:100%}
.group-header{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:2px;margin-bottom:12px;display:flex;align-items:center;gap:8px;word-break:break-word}
.group-header::before{content:'';width:4px;height:14px;background:#00ADEF;flex-shrink:0}

/* Using minmax(0, 1fr) eliminates all horizontal Grid overflow on smartphones */
.tiles-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;width:100%}
.tile{position:relative;background:#2d2d2d;padding:15px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .1s ease-out,filter .2s;aspect-ratio:1;outline:2px solid transparent;min-width:0;overflow-wrap:break-word;word-wrap:break-word}
.tile:hover{filter:brightness(1.12);outline:2px solid rgba(255,255,255,.25);z-index:2}
.tile.tilt-top-left{transform:perspective(400px) rotateX(6deg) rotateY(-6deg) scale(.97)}
.tile.tilt-top-right{transform:perspective(400px) rotateX(6deg) rotateY(6deg) scale(.97)}
.tile.tilt-bottom-left{transform:perspective(400px) rotateX(-6deg) rotateY(-6deg) scale(.97)}
.tile.tilt-bottom-right{transform:perspective(400px) rotateX(-6deg) rotateY(6deg) scale(.97)}
.tile-2x2{grid-column:span 2;grid-row:span 2;aspect-ratio:1}
.tile-4x2{grid-column:span 4;grid-row:span 2;aspect-ratio:2/1}
.tile-4x4{grid-column:span 4;grid-row:span 4;aspect-ratio:1}
.bg-emerald{background:#10893E}.bg-blue{background:#0078D7}.bg-navy{background:#1E3A8A}.bg-indigo{background:#4D394B}.bg-purple{background:#881798}.bg-teal{background:#008272}.bg-orange{background:#CA5010}.bg-red{background:#E81123}.bg-cyan{background:#0099BC}.bg-steel{background:#5558AF}.bg-dark{background:#1E1E1E}.bg-magenta{background:#9A0089}.bg-gold{background:#FF8C00}
.t-icon{font-size:26px;line-height:1}
.t-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;opacity:.9;overflow-wrap:break-word;word-break:break-word}
.t-val{font-size:clamp(22px,6vw,42px);font-weight:100;line-height:1.1;word-break:break-all}
.t-sub{font-size:11px;opacity:.75;margin-top:2px;overflow-wrap:break-word}
.main-day-tile .val-box{margin-top:auto;min-width:0}
.main-day-tile .days-num{font-size:clamp(65px,16vw,110px);font-weight:100;line-height:.88;letter-spacing:-2px}
.main-day-tile .days-txt{font-size:clamp(16px,4vw,22px);font-weight:300;opacity:.9;margin-top:8px;text-transform:uppercase;letter-spacing:1px}
.pulse-badge{position:absolute;top:14px;right:14px;display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.35);padding:4px 10px;border-radius:20px;font-size:10px;font-weight:600}
.dot-green{width:8px;height:8px;border-radius:50%;background:#50E3C2;animation:pulseGlow 1.8s infinite;flex-shrink:0}
@keyframes pulseGlow{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:.6}}
.prog-wrap{display:flex;align-items:center;gap:14px;margin-top:auto;padding-top:8px;min-width:0}
.prog-svg{transform:rotate(-90deg);flex-shrink:0}
.prog-bg{fill:none;stroke:rgba(255,255,255,.2);stroke-width:7}
.prog-fill{fill:none;stroke:#fff;stroke-width:7;transition:stroke-dashoffset .8s ease}
.quote-box{display:flex;flex-direction:column;justify-content:center;height:100%}
.quote-txt{font-size:13px;font-weight:300;font-style:italic;line-height:1.4}
.quote-auth{font-size:11px;opacity:.7;margin-top:6px;font-weight:600}
.live-preview-text{font-size:12px;line-height:1.4;opacity:.85;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.achiev-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;align-content:center;height:100%;width:100%}
.achiev-item{text-align:center;opacity:.25;transition:all .3s;min-width:0}
.achiev-item.unlocked{opacity:1;transform:scale(1.05)}
.achiev-item.unlocked .a-ic{filter:drop-shadow(0 0 8px rgba(255,215,0,.6))}
.a-ic{font-size:20px}
.a-txt{font-size:9px;font-weight:600;margin-top:2px;overflow-wrap:break-word}
.action-tile{align-items:center;justify-content:center;text-align:center}
.action-tile .t-icon{font-size:32px;margin-bottom:6px}

/* ===== MODALS (RESPONSIVE) ===== */
.metro-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);z-index:1000;display:flex;justify-content:center;align-items:center;padding:16px;opacity:0;visibility:hidden;transition:all .25s cubic-bezier(.1,.9,.2,1)}
.metro-modal-overlay.active{opacity:1;visibility:visible}
.metro-modal-window{background:#1c1c1c;border:1px solid #3d3d3d;border-top:5px solid #00ADEF;width:100%;max-width:580px;padding:24px;box-shadow:0 15px 35px rgba(0,0,0,.7);transform:scale(.9);transition:transform .25s cubic-bezier(.1,.9,.2,1);max-height:92vh;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.metro-modal-overlay.active .metro-modal-window{transform:scale(1)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid #333;gap:10px}
.modal-title{font-size:22px;font-weight:300;display:flex;align-items:center;gap:10px;overflow-wrap:break-word}
.modal-close{background:none;border:none;color:#aaa;font-size:24px;cursor:pointer;flex-shrink:0}
.modal-close:hover{color:#e81123}
.modal-body{overflow-y:auto;flex:1;padding-right:4px;min-width:0}
.modal-footer{display:flex;gap:10px;margin-top:20px;padding-top:14px;border-top:1px solid #333;flex-wrap:wrap}
.m-btn{flex:1 1 auto;padding:12px 16px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:1px;border:none;cursor:pointer;transition:all .15s;text-align:center;min-width:120px}
.m-btn-primary{background:#00ADEF;color:#fff}.m-btn-primary:hover{background:#2bbfeb}
.m-btn-secondary{background:#3d3d3d;color:#ccc}.m-btn-secondary:hover{background:#4d4d4d;color:#fff}
.m-btn-danger{background:#e81123;color:#fff}.m-btn-danger:hover{background:#ff293b}
.todo-input-wrap{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.todo-input{flex:1 1 200px;padding:12px 14px;background:#282828;border:2px solid #444;color:#fff;font-size:15px;outline:none;min-width:0}
.todo-input:focus{border-color:#00ADEF}
.todo-add-btn{background:#10893E;color:#fff;border:none;padding:12px 22px;font-weight:600;cursor:pointer;flex-shrink:0}
.todo-add-btn:hover{background:#13a149}
.todo-list{list-style:none;display:flex;flex-direction:column;gap:8px}
.todo-item{display:flex;align-items:center;justify-content:space-between;background:#262626;padding:10px 12px;border-left:4px solid #00ADEF;gap:10px}
.todo-item.completed{border-left-color:#555;opacity:.6}
.todo-item.completed .todo-text{text-decoration:line-through}
.todo-left{display:flex;align-items:center;gap:10px;flex:1;cursor:pointer;min-width:0}
.todo-checkbox{width:18px;height:18px;accent-color:#00ADEF;cursor:pointer;flex-shrink:0}
.todo-text{font-size:14px;overflow-wrap:break-word;word-break:break-word}
.todo-del{background:none;border:none;color:#888;font-size:18px;cursor:pointer;padding:4px 8px;flex-shrink:0}
.todo-del:hover{color:#e81123}
.calc-display{background:#141414;border:2px solid #333;padding:14px;text-align:right;margin-bottom:12px;min-width:0}
.calc-sub{font-size:13px;color:#777;min-height:18px;font-family:monospace;overflow-x:auto}
.calc-main{font-size:32px;font-weight:200;overflow-x:auto;font-family:monospace}
.calc-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.calc-btn{background:#303030;color:#fff;border:none;padding:16px 0;font-size:18px;cursor:pointer;transition:background .15s,transform .1s}
.calc-btn:hover{background:#3f3f3f}.calc-btn:active{transform:scale(.96)}
.calc-op{background:#1c5082;font-weight:600}.calc-op:hover{background:#2465a3}
.calc-eq{background:#10893E;font-weight:600}.calc-eq:hover{background:#15a34a}
.calc-clear{background:#a82020}.calc-clear:hover{background:#c72626}
.note-input-area{width:100%;height:110px;background:#262626;border:2px solid #444;color:#fff;padding:12px;font-size:14px;resize:none;outline:none;margin-bottom:10px;box-sizing:border-box}
.note-input-area:focus{border-color:#00ADEF}
.note-list-container{display:flex;flex-direction:column;gap:10px;margin-top:15px;max-height:260px;overflow-y:auto}
.note-card{background:#242424;border-left:4px solid #FF8C00;padding:12px;position:relative}
.note-time{font-size:11px;color:#888;margin-bottom:6px}
.note-content{font-size:13px;color:#eee;line-height:1.5;overflow-wrap:break-word}
.note-del-btn{position:absolute;top:8px;right:8px;background:none;border:none;color:#666;font-size:16px;cursor:pointer}
.note-del-btn:hover{color:#e81123}
.about-legal-box{background:#232323;border-left:4px solid #0078D7;padding:14px;margin-top:14px;font-size:12px;color:#ccc;line-height:1.6;overflow-wrap:break-word}
.about-title-sub{font-size:14px;font-weight:600;color:#fff;margin-top:14px;margin-bottom:6px}
.hidden{display:none!important}

/* ===== CROSS-PLATFORM MOBILE & PORTRAIT SCREEN OPTIMIZATION (1080x2400 & All Viewports) ===== */
@media(min-width:1024px){
  .groups-wrapper{flex-wrap:nowrap}
}
@media(max-width:1023px){
  .groups-wrapper{flex-direction:column;gap:28px}
  .tile-group{width:100%;min-width:0;flex:1 1 100%}
  .win-header{padding-right:0;margin-bottom:20px}
}
@media(max-width:767px){
  .start-screen{padding:16px}
  .win-header{flex-direction:column;align-items:flex-start;gap:12px;margin-bottom:24px;padding-top:48px;width:100%}
  .win-user-area{width:100%;background:rgba(255,255,255,.05);border-radius:6px;padding:8px 12px}
  .header-clock{text-align:left;align-self:flex-start;padding-left:4px}
  .clock-time{font-size:32px}
  .user-name-title{font-size:20px}
  .addiction-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  
  /* Converting strict aspect-ratios to flexible heights prevents all vertical/horizontal overflows */
  .tile-2x2{aspect-ratio:auto;min-height:130px;grid-row:auto}
  .tile-4x2{aspect-ratio:auto;min-height:115px;grid-row:auto}
  .tile-4x4{aspect-ratio:auto;min-height:220px;grid-row:auto;padding:18px}
  .tile{padding:13px}
  
  .t-icon{font-size:24px}
  .t-val{font-size:clamp(20px,5.5vw,32px)}
  .pulse-badge{top:12px;right:12px;padding:3px 8px;font-size:9px}
  
  .metro-modal-window{padding:16px;max-height:95vh}
  .m-btn{min-width:100%}
  .boot-disclaimer{bottom:10px;font-size:10px}
}
@media(max-width:380px){
  .tile-2x2{min-height:120px;padding:10px}
  .t-val{font-size:20px}
  .achiev-grid{gap:4px}
  .a-ic{font-size:17px}
  .a-txt{font-size:8px}
}
</style>
</head>
<body>

<!-- GLOBAL LANGUAGE TOGGLE -->
<button class="lang-toggle hidden" id="langToggle" title="Change language / Dili değiştir">
  <span class="flag" id="langFlag">🇹🇷</span>
  <span class="code" id="langCode">TR</span>
</button>

<!-- 1. BOOT SCREEN -->
<div id="bootScreen" class="boot-screen">
  <svg class="boot-custom-emblem" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <path d="M50 5 L88 22 V52 C88 74 69 91 50 95 C31 91 12 74 12 52 V22 L50 5Z" fill="#0078D7" fill-opacity="0.3" stroke="#00ADEF" stroke-width="4" stroke-linejoin="round"/>
    <path d="M50 20 L72 38 L50 78 L28 38 L50 20Z" fill="#00ADEF"/>
    <path d="M50 20 L72 38 L50 50 L28 38 L50 20Z" fill="#FFFFFF" fill-opacity="0.9"/>
    <circle cx="50" cy="53" r="10" fill="#000000"/>
    <path d="M45 53 L49 48 L53 55 L57 50" stroke="#00ADEF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div class="win8-spinner">
    <div class="win8-ring"></div><div class="win8-ring"></div><div class="win8-ring"></div><div class="win8-ring"></div><div class="win8-ring"></div>
  </div>
  <div class="boot-main-title" data-i18n="bootTitle"></div>
  <div class="boot-disclaimer" data-i18n="bootLegal"></div>
</div>

<!-- 2. OOBE SETUP -->
<div id="oobeScreen" class="oobe-screen hidden">
  <div class="oobe-box">
    <h1 class="oobe-title" data-i18n="oobeTitle"></h1>
    <p class="oobe-desc" data-i18n="oobeDesc"></p>
    <form id="setupForm" novalidate>
      <div class="form-group">
        <label class="oobe-label"><span data-i18n="oobeStep1"></span> <span style="color:#ff4754">*</span></label>

let LANG = localStorage.getItem('metro_lang') || 'tr';
const T = () => I18N[LANG];
const fmt = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k] ?? '');

let appState = { userName:'', habitKey:'smoke', habitName:'', habitIcon:'🚭', habitCustom:false,
  startDate:null, bestStreak:0, attempts:1, isActive:false, notes:[], todos:[] };

/* ===== APPLY LANGUAGE ===== */
function applyLanguage(){
  const t = T();
  document.documentElement.lang = t.htmlLang;
  document.title = t.docTitle;
  document.getElementById('langFlag').textContent = t.flag;
  document.getElementById('langCode').textContent = t.code;

  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.getAttribute('data-i18n');
    if(t[k]!==undefined) el.textContent = t[k];
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{
    const k = el.getAttribute('data-i18n-ph');
    if(t[k]!==undefined) el.placeholder = t[k];
  });

  // Preset habit name follows language unless custom
  if(!appState.habitCustom && appState.habitKey && t.habits[appState.habitKey]){
    appState.habitName = t.habits[appState.habitKey];
  }
  localStorage.setItem('metro_lang', LANG);
  if(!document.getElementById('startScreen').classList.contains('hidden')){
    updateUIDisplay(); rotateRandomQuote(); updateClock();
  }
}

document.getElementById('langToggle').addEventListener('click',()=>{
  LANG = (LANG==='tr') ? 'en' : 'tr';
  applyLanguage();
  saveState();
});

/* ===== STORAGE ===== */
const KEY='metro_antiaddict_v3';
function loadState(){
  const raw = localStorage.getItem(KEY);
  if(!raw) return false;
  try{
    const p = JSON.parse(raw);
    appState = {...appState, ...p};
    if(appState.startDate) appState.startDate = new Date(appState.startDate);
    appState.notes = appState.notes||[]; appState.todos = appState.todos||[];
    return true;
  }catch(e){ return false; }
}
function saveState(){
  localStorage.setItem(KEY, JSON.stringify({...appState,
    startDate: appState.startDate ? new Date(appState.startDate).toISOString() : null}));
}

/* ===== CALCULATIONS ===== */
const elapsedDays = () => appState.startDate&&appState.isActive
  ? Math.max(0,Math.floor((Date.now()-new Date(appState.startDate).getTime())/864e5)) : 0;
const elapsedHours = () => appState.startDate&&appState.isActive
  ? Math.max(0,Math.floor((Date.now()-new Date(appState.startDate).getTime())/36e5)) : 0;

/* ===== CLOCK ===== */
function updateClock(){
  const t=T(), d=new Date();
  const ct=document.getElementById('clockTime'); if(!ct) return;
  ct.textContent = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  document.getElementById('clockDate').textContent =
    LANG==='tr' ? `${d.getDate()} ${t.months[d.getMonth()]} ${d.getFullYear()}, ${t.days[d.getDay()]}`
                : `${t.days[d.getDay()]}, ${t.months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
}

/* ===== UI UPDATE ===== */
function updateUIDisplay(){
  const t=T(), days=elapsedDays();
  if(days>appState.bestStreak){ appState.bestStreak=days; saveState(); }

  document.getElementById('displayUsername').textContent = appState.userName;
  document.getElementById('displayHabitBadge').textContent = `${appState.habitIcon} ${appState.habitName}`;
  document.getElementById('mainTileTargetLabel').textContent = `${appState.habitName.toUpperCase()} ${t.seriesSuffix}`;
  document.getElementById('counterDays').textContent = days;
  document.getElementById('counterHours').textContent = elapsedHours();
  document.getElementById('counterWeeks').textContent = Math.floor(days/7);
  document.getElementById('bestStreakVal').textContent = appState.bestStreak;
  document.getElementById('attemptsVal').textContent = appState.attempts;

  let lvl=t.levels[0];
  t.levels.forEach(l=>{ if(days>=l[0]) lvl=l; });
  document.getElementById('displayLevelName').textContent = lvl[1];

  const pct = Math.min(100, Math.floor(days/90*100));
  document.getElementById('progressPercent').textContent = pct+'%';
  document.getElementById('remainingDaysTxt').textContent = days>=90 ? t.goalDone : fmt(t.daysLeft,{n:90-days});
  document.getElementById('progressCircle').style.strokeDashoffset = 176 - 176*pct/100;

  let unlocked=0;
  document.querySelectorAll('.achiev-item').forEach(el=>{
    if(days>=parseInt(el.dataset.days)){ el.classList.add('unlocked'); unlocked++; }
    else el.classList.remove('unlocked');
  });
  document.getElementById('badgeCountText').textContent = `${unlocked}/4`;

  updateTodosUI(); updateNotesUI();
}

function rotateRandomQuote(){
  const q = T().quotes[Math.floor(Math.random()*T().quotes.length)];
  document.getElementById('quoteText').textContent = `"${q[0]}"`;
  document.getElementById('quoteAuthor').textContent = `— ${q[1]}`;
}

/* ===== BOOT ===== */
window.addEventListener('DOMContentLoaded',()=>{
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('startDateInput').max = today;
  document.getElementById('startDateInput').value = today;
  document.getElementById('settingDate').max = today;

  const had = loadState();
  applyLanguage();
  setupTilt(); setupHabitCards();
  updateClock(); setInterval(updateClock,1000);

  setTimeout(()=>{
    const b=document.getElementById('bootScreen');
    b.classList.add('fade-out');
    setTimeout(()=>{
      b.style.display='none';
      document.getElementById('langToggle').classList.remove('hidden');
      if(had && appState.isActive && appState.userName) showStartScreen();
      else document.getElementById('oobeScreen').classList.remove('hidden');
    },600);
  },2500);
});

function showStartScreen(){
  document.getElementById('oobeScreen').classList.add('hidden');
  const s=document.getElementById('startScreen');
  s.classList.remove('hidden'); s.classList.add('animate-in');
  updateUIDisplay(); rotateRandomQuote(); updateClock();
}

/* ===== HABIT SELECTION ===== */
let selKey='smoke', selIcon='🚭';
function setupHabitCards(){
  const cards=document.querySelectorAll('#addictionGrid .addict-card');
  cards.forEach(c=>c.addEventListener('click',function(){
    cards.forEach(x=>x.classList.remove('selected'));
    this.classList.add('selected');
    selKey=this.dataset.key; selIcon=this.dataset.icon;
    const box=document.getElementById('customHabitContainer');
    if(selKey==='custom'){ box.classList.remove('hidden'); document.getElementById('customHabitInput').focus(); }
    else box.classList.add('hidden');
    // Show a professional-support notice for sensitive categories
    document.getElementById('supportNotice').classList.toggle('hidden', selKey!=='drug' && selKey!=='selfharm');
  }));
}

document.getElementById('setupForm').addEventListener('submit',e=>{
  e.preventDefault();
  const t=T(), nameI=document.getElementById('userNameInput'), dateI=document.getElementById('startDateInput'),
        custI=document.getElementById('customHabitInput');
  let ok=true;
  const name=nameI.value.trim(), date=new Date(dateI.value);
  const end=new Date(); end.setHours(23,59,59,999);

  if(name.length<2){ nameI.classList.add('error'); document.getElementById('nameError').style.display='block'; ok=false; }
  else { nameI.classList.remove('error'); document.getElementById('nameError').style.display='none'; }

  let hName, hIcon=selIcon, isCustom=false;
  if(selKey==='custom'){
    const v=custI.value.trim();
    if(!v){ custI.classList.add('error'); document.getElementById('habitError').style.display='block'; ok=false; }
    else { custI.classList.remove('error'); document.getElementById('habitError').style.display='none'; hName=v; hIcon='🎯'; isCustom=true; }
  } else hName = t.habits[selKey];

  if(isNaN(date)||date>end){ dateI.classList.add('error'); document.getElementById('dateError').style.display='block'; ok=false; }
  else { dateI.classList.remove('error'); document.getElementById('dateError').style.display='none'; }

  if(!ok) return;
  Object.assign(appState,{userName:name,habitKey:selKey,habitName:hName,habitIcon:hIcon,habitCustom:isCustom,
    startDate:date,isActive:true,attempts:1,bestStreak:0});
  saveState(); showStartScreen();
});

/* ===== TILT ===== */
function setupTilt(){
  document.querySelectorAll('.tilt-effect').forEach(tile=>{
    tile.addEventListener('pointerdown',function(e){
      const r=this.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
      const cls = (x<r.width/2 ? (y<r.height/2?'tilt-top-left':'tilt-bottom-left')
                               : (y<r.height/2?'tilt-top-right':'tilt-bottom-right'));
      this.classList.add(cls);
    });
    const reset=function(){ this.classList.remove('tilt-top-left','tilt-top-right','tilt-bottom-left','tilt-bottom-right'); };
    tile.addEventListener('pointerup',reset);
    tile.addEventListener('pointerleave',reset);
    tile.addEventListener('pointercancel',reset);
  });
}

/* ===== MODALS ===== */
const openModal = id => document.getElementById(id).classList.add('active');
const closeModal = id => document.getElementById(id).classList.remove('active');
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>closeModal(b.dataset.close)));
document.querySelectorAll('.metro-modal-overlay').forEach(o=>o.addEventListener('click',e=>{ if(e.target===o) o.classList.remove('active'); }));

document.getElementById('btnOpenTodo').addEventListener('click',()=>openModal('todoModal'));
document.getElementById('btnOpenNotes').addEventListener('click',()=>openModal('notesModal'));
document.getElementById('btnOpenCalc').addEventListener('click',()=>openModal('calcModal'));
document.getElementById('btnOpenAbout').addEventListener('click',()=>openModal('aboutModal'));
document.getElementById('tileQuote').addEventListener('click',rotateRandomQuote);

function openSettings(){
  document.getElementById('settingUsername').value=appState.userName;
  document.getElementById('settingHabitName').value=appState.habitName;
  document.getElementById('settingHabitIcon').value=appState.habitIcon;
  if(appState.startDate) document.getElementById('settingDate').value=new Date(appState.startDate).toISOString().split('T')[0];
  openModal('settingsModal');
}
document.getElementById('actionSettings').addEventListener('click',openSettings);
document.getElementById('btnHeaderProfile').addEventListener('click',openSettings);

function confirmDialog(title,desc,onYes){
  document.getElementById('confirmTitle').textContent=title;
  document.getElementById('confirmDesc').textContent=desc;
  document.getElementById('btnConfirmYes').onclick=()=>{ onYes(); closeModal('confirmModal'); };
  openModal('confirmModal');
}
function newStreak(){
  const d=elapsedDays(); if(d>appState.bestStreak) appState.bestStreak=d;
  appState.startDate=new Date(); appState.attempts++; saveState(); updateUIDisplay();
}
document.getElementById('actionNewStart').addEventListener('click',()=>
  confirmDialog(T().cfmNewTitle, fmt(T().cfmNewDesc,{habit:appState.habitName}), newStreak));
document.getElementById('actionReset').addEventListener('click',()=>
  confirmDialog(T().cfmResetTitle, T().cfmResetDesc, newStreak));

/* ===== TODO ===== */
function updateTodosUI(){
  const t=T(), list=document.getElementById('todoListUI'), empty=document.getElementById('todoEmptyState');
  list.innerHTML=''; const todos=appState.todos;
  const pending=todos.filter(x=>!x.completed).length;
  document.getElementById('todoBadge').textContent=fmt(t.todoBadge,{n:pending});
  const prev=document.getElementById('todoPreview');
  if(!todos.length){ empty.style.display='block'; prev.textContent=t.todoEmptyPreview; return; }
  empty.style.display='none';
  const first=todos.find(x=>!x.completed);
  prev.textContent = first ? `👉 ${first.text}` : t.todoAllDone;
  todos.forEach((x,i)=>{
    const li=document.createElement('li');
    li.className='todo-item'+(x.completed?' completed':'');
    li.innerHTML=`<div class="todo-left"><input type="checkbox" class="todo-checkbox" ${x.completed?'checked':''}><span class="todo-text">${esc(x.text)}</span></div><button class="todo-del">✕</button>`;
    li.querySelector('.todo-left').onclick=()=>{ appState.todos[i].completed=!appState.todos[i].completed; saveState(); updateTodosUI(); };
    li.querySelector('.todo-del').onclick=()=>{ appState.todos.splice(i,1); saveState(); updateTodosUI(); };
    list.appendChild(li);
  });
}
document.getElementById('btnAddTodo').addEventListener('click',()=>{
  const i=document.getElementById('todoInput'), v=i.value.trim();
  if(v){ appState.todos.push({text:v,completed:false}); i.value=''; saveState(); updateTodosUI(); }
});
document.getElementById('todoInput').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('btnAddTodo').click(); });

/* ===== NOTES ===== */
function updateNotesUI(){
  const t=T(), box=document.getElementById('notesListUI'); box.innerHTML='';
  document.getElementById('notesCountText').textContent=fmt(t.notesCount,{n:appState.notes.length});
  if(!appState.notes.length){ box.innerHTML=`<div style="text-align:center;color:#666;padding:20px">${t.noNotes}</div>`; return; }
  appState.notes.slice().reverse().forEach((n,idx)=>{
    const real=appState.notes.length-1-idx;
    const d=document.createElement('div'); d.className='note-card';
    d.innerHTML=`<button class="note-del-btn">✕</button><div class="note-time">${esc(n.time)}</div><div class="note-content">${esc(n.text)}</div>`;
    d.querySelector('.note-del-btn').onclick=()=>{ appState.notes.splice(real,1); saveState(); updateNotesUI(); };
    box.appendChild(d);
  });
}
document.getElementById('btnSaveNote').addEventListener('click',()=>{
  const a=document.getElementById('noteTextarea'), v=a.value.trim(); if(!v) return;
  const t=T(), d=new Date();
  const stamp = LANG==='tr'
    ? `${d.getDate()} ${t.months[d.getMonth()]} ${d.getFullYear()} - ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`
    : `${t.months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()} - ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  appState.notes.push({text:v,time:stamp}); a.value=''; saveState(); updateNotesUI();
});

/* ===== CALCULATOR ===== */
let calcExpr='';
const cM=()=>document.getElementById('calcMainDisplay'), cS=()=>document.getElementById('calcSubDisplay');
function calcNum(n){ if(cM().textContent==='0'&&n!=='.') calcExpr=''; calcExpr+=n; cM().textContent=calcExpr; }
function calcOp(o){ if(!calcExpr) calcExpr='0'; calcExpr+=' '+o+' '; cS().textContent=calcExpr; cM().textContent=''; }
function calcAppend(s){ calcExpr+=s; cM().textContent=calcExpr; }
function calcClear(){ calcExpr=''; cM().textContent='0'; cS().textContent=''; }
function calcEqual(){
  try{
    const clean=calcExpr.replace(/[^-()\d/*+.]/g,'');
    const r=new Function('return '+clean)();
    cS().textContent=calcExpr+' ='; cM().textContent=r; calcExpr=String(r);
  }catch(e){ cM().textContent='Error'; calcExpr=''; }
}

/* ===== SETTINGS ===== */
document.getElementById('btnSaveSettings').addEventListener('click',()=>{
  const t=T();
  const n=document.getElementById('settingUsername').value.trim();
  const h=document.getElementById('settingHabitName').value.trim();
  const ic=document.getElementById('settingHabitIcon').value.trim();
  const d=new Date(document.getElementById('settingDate').value);
  const end=new Date(); end.setHours(23,59,59,999);
  if(n.length<2) return alert(t.alertName);
  if(!h) return alert(t.alertHabit);
  if(isNaN(d)||d>end) return alert(t.alertDate);
  if(h!==appState.habitName){ appState.habitCustom=true; appState.habitKey='custom'; }
  Object.assign(appState,{userName:n,habitName:h,habitIcon:ic||'🎯',startDate:d});
  saveState(); updateUIDisplay(); closeModal('settingsModal');
});

/* ===== EXPORT / IMPORT ===== */
function ioMsg(m,c){ const e=document.getElementById('ioStatusMsg'); e.textContent=m; e.style.color=c;
  clearTimeout(e._t); e._t=setTimeout(()=>e.textContent='',6000); }
function exportAppData(){
  const t=T();
  try{
    const payload={_app:'Metro UI Anti-Addiction',_version:'3.0',_exportedAt:new Date().toISOString(),
      data:{...appState,startDate:appState.startDate?new Date(appState.startDate).toISOString():null}};
    const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));
    const d=new Date();
    const stamp=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const a=document.createElement('a');
    a.href=url; a.download=`willpower-backup_${(appState.userName||'user').replace(/[^\w-]/g,'_')}_${stamp}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
    ioMsg(t.ioOk,'#10c95e');
  }catch(e){ ioMsg(t.ioErr,'#ff4754'); }
}
document.getElementById('importFileInput').addEventListener('change',e=>{
  const t=T(), f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const p=JSON.parse(ev.target.result), inc=p&&p.data?p.data:p;
      if(!inc||!inc.userName||!inc.startDate){ ioMsg(t.ioBad,'#ff4754'); e.target.value=''; return; }
      const d=new Date(inc.startDate), end=new Date(); end.setHours(23,59,59,999);
      if(isNaN(d)||d>end){ ioMsg(t.ioBadDate,'#ff4754'); e.target.value=''; return; }
      if(!confirm(t.ioConfirm)){ e.target.value=''; return; }
      appState={userName:String(inc.userName).trim(),habitKey:inc.habitKey||'custom',
        habitName:inc.habitName||'—',habitIcon:inc.habitIcon||'🎯',habitCustom:inc.habitCustom!==false,
        startDate:d,bestStreak:+inc.bestStreak||0,attempts:+inc.attempts||1,isActive:true,
        notes:Array.isArray(inc.notes)?inc.notes:[],todos:Array.isArray(inc.todos)?inc.todos:[]};
      saveState(); updateUIDisplay(); openSettings();
      ioMsg(fmt(t.ioLoaded,{name:appState.userName}),'#10c95e');
      e.target.value='';
    }catch(err){ ioMsg(t.ioRead,'#ff4754'); e.target.value=''; }
  };
  r.readAsText(f);
});
function resetAllApp(){ if(confirm(T().resetConfirm)){ localStorage.removeItem(KEY); location.reload(); } }

const esc = s => { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; };
setInterval(()=>{ if(!document.getElementById('startScreen').classList.contains('hidden')) updateUIDisplay(); },60000);
</script>
